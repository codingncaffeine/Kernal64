name: Release

# A tag v* builds the core for every system and makes a DRAFT release with the zips and their
# checksums; the draft is checked and published by hand. Run by hand (workflow_dispatch) it only
# builds, to try the builds before a tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-windows:
    name: Linux (glibc, musl) and Windows cores
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build in containers
        run: K64_JOBS=4 tools/release/build-cores.sh
      - uses: actions/upload-artifact@v5
        with:
          name: cores-linux-windows
          path: dist/kernal64_libretro-*.zip

  macos:
    name: macOS cores (arm64, x86_64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build both
        run: |
          for arch in arm64 x86_64; do
            cmake -S . -B build-$arch -DCMAKE_BUILD_TYPE=Release -DK64_CORE_ONLY=ON \
              -DCMAKE_OSX_ARCHITECTURES=$arch -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
            cmake --build build-$arch -j 3
            strip -x build-$arch/kernal64_libretro.dylib
            lipo -info build-$arch/kernal64_libretro.dylib
            nm -gU build-$arch/kernal64_libretro.dylib | grep -E ' _(retro_run|kernal64_make_hard_drive)$'
          done
      - name: Load and run the arm64 core (no system ROMs here; it must still load and run frames)
        run: build-arm64/k64host build-arm64/kernal64_libretro.dylib --frames 120
      - name: Package
        run: |
          for arch in arm64 x86_64; do
            mkdir pkg-$arch && cp build-$arch/kernal64_libretro.dylib packaging/kernal64_libretro.info LICENSE pkg-$arch/
            (cd pkg-$arch && zip -q -9 ../kernal64_libretro-macos-$arch.zip kernal64_libretro.dylib kernal64_libretro.info LICENSE)
          done
      - uses: actions/upload-artifact@v5
        with:
          name: cores-macos
          path: kernal64_libretro-macos-*.zip

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.zip > SHA256SUMS
      - name: Draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --draft --title "Kernal64 $GITHUB_REF_NAME" --notes "Release notes to be written before publishing."
